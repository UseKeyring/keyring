<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyring Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='7' fill='none' stroke='black' stroke-width='3'/><path d='M19 16h11M26 16v5' stroke='black' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*__ASCII_TOKENS__*/
/*
 * Keyring Studio — the ASCII design system of the website (tokens are inlined
 * from apps/web/src/app/ascii-tokens.css at build time). Paper / charcoal,
 * hairline rails, shared-border cells, 2px corners, mono UI, one orange accent.
 */
.ascii {
  --a-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --a-font-display: "Inter Tight", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  /* aliases used by inline styles in the view code */
  --ok: var(--a-ok); --bad: var(--a-bad); --warn: var(--a-accent); --muted: var(--a-muted);
  --ink: var(--a-fg); --line: var(--a-line); --card: var(--a-panel); --link: var(--a-accent);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body.ascii {
  background-color: var(--a-bg);
  background-image: var(--a-noise-page);
  background-size: 180px 180px;
  color: var(--a-fg);
  font: 13px/1.6 var(--a-font-mono);
}
::selection { background: var(--a-accent); color: var(--a-accent-fg); }
a { color: var(--a-accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
code, pre, .mono { font-family: var(--a-font-mono); font-size: 12.5px; }
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

/* ── sidebar ── */
nav { border-right: 1px solid var(--a-line); background-color: var(--a-bg); background-image: var(--a-noise); background-size: 180px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; counter-reset: navn; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--a-fg); font: 400 18px/1 var(--a-font-display); letter-spacing: -0.02em; padding: 0 18px; height: 56px; border-bottom: 1px solid var(--a-line); margin-bottom: 10px; }
.brand .mark { width: 18px; height: 18px; background-color: currentColor; -webkit-mask: url("__KEYRING_MARK__") center / contain no-repeat; mask: url("__KEYRING_MARK__") center / contain no-repeat; }
.brand small { font: 11px var(--a-font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--a-muted); border: 1px solid var(--a-line-strong); padding: 1px 6px; border-radius: 2px; }
nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 0 10px 2px; padding: 7px 10px; border-radius: 2px; color: var(--a-muted); counter-increment: navn; }
nav button::before { content: "[" counter(navn, decimal-leading-zero) "]"; color: var(--a-dim); font-size: 11px; }
nav button:hover { background: var(--a-panel); color: var(--a-fg); }
nav button.on { background: var(--a-panel); color: var(--a-fg); box-shadow: inset 2px 0 0 var(--a-accent); }
nav button.on::before { color: var(--a-accent); }
nav button:focus-visible { outline: 1px solid var(--a-accent); outline-offset: 1px; }
nav .foot { margin-top: auto; padding: 14px 18px; font-size: 11.5px; color: var(--a-dim); word-break: break-all; border-top: 1px solid var(--a-line); }

/* ── main ── */
main { padding: 0 0 64px; min-width: 0; }
header.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 32px; min-height: 56px; border-bottom: 1px solid var(--a-line); position: sticky; top: 0; z-index: 5; background-color: var(--a-bg); background-image: var(--a-noise); background-size: 180px; }
header.top h1 { margin: 0; font: 300 15px var(--a-font-mono); color: var(--a-muted); letter-spacing: 0; }
header.top h1::before { content: "keyring / " attr(data-ws) " / "; color: var(--a-dim); }
#view { padding: 32px; max-width: 1180px; }
#view::before { content: attr(data-title); display: block; font: 300 clamp(30px, 3.6vw, 44px)/1.05 var(--a-font-display); letter-spacing: -0.03em; color: var(--a-fg); margin: 0 0 26px; }
.grow { flex: 1; }

/* ── controls ── */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--a-line-strong); border-radius: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--a-muted); white-space: nowrap; }
.pill.ok { color: var(--a-ok); border-color: color-mix(in srgb, var(--a-ok) 45%, transparent); }
.pill.bad { color: var(--a-bad); border-color: color-mix(in srgb, var(--a-bad) 45%, transparent); }
.pill.dark { color: var(--a-accent); border-color: var(--a-accent); }
.pill .live { width: 6px; height: 6px; border-radius: 50%; background: var(--a-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--a-ok) 18%, transparent); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--a-accent); border-radius: 2px; background-color: var(--a-accent); background-image: var(--a-noise); background-size: 180px; color: var(--a-accent-fg); font: 12.5px var(--a-font-mono); white-space: nowrap; transition: background-color .12s, border-color .12s, color .12s; }
.btn:hover { background-color: var(--a-accent-hover); border-color: var(--a-accent-hover); }
.btn.ghost { background-color: transparent; border-color: var(--a-line-strong); color: var(--a-fg); }
.btn.ghost:hover { background-color: var(--a-raised); border-color: var(--a-muted); }
.btn.danger { background-color: transparent; border-color: color-mix(in srgb, var(--a-bad) 55%, transparent); color: var(--a-bad); }
.btn.danger:hover { background-color: color-mix(in srgb, var(--a-bad) 10%, transparent); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn:focus-visible { outline: 1px solid var(--a-accent); outline-offset: 2px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
input, select, textarea { font: 13px var(--a-font-mono); color: var(--a-fg); background-color: var(--a-panel); background-image: var(--a-noise); background-size: 180px; border: 1px solid var(--a-line-strong); border-radius: 2px; padding: 8px 10px; min-width: 0; height: 36px; outline: none; }
textarea { height: auto; width: 100%; resize: vertical; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--a-dim); }
input:focus, select:focus, textarea:focus { border-color: var(--a-accent); }
/* checkbox: square, orange + check mark when on */
input[type="checkbox"] { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; padding: 0; margin: 0; flex: 0 0 auto; display: inline-grid; place-content: center; border: 1px solid var(--a-line-strong); border-radius: 2px; background: var(--a-panel); cursor: pointer; transition: background-color .1s, border-color .1s; }
input[type="checkbox"]::before { content: ""; width: 9px; height: 9px; background: var(--a-accent-fg); clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); transform: scale(0); transition: transform .1s; }
input[type="checkbox"]:checked { background: var(--a-accent); border-color: var(--a-accent); }
input[type="checkbox"]:checked::before { transform: scale(1); }
input[type="checkbox"]:hover { border-color: var(--a-muted); }
input[type="checkbox"]:focus-visible { outline: 1px solid var(--a-accent); outline-offset: 2px; }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ── select (custom trigger; the native <select> stays in the DOM, visually hidden) ── */
.sel { position: relative; display: inline-flex; min-width: 0; }
.row > .sel { flex: 1 1 160px; }
.sel > select { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
.sel-btn { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; height: 36px; padding: 0 10px 0 12px; border: 1px solid var(--a-line-strong); border-radius: 2px; background-color: var(--a-panel); background-image: var(--a-noise); background-size: 180px; color: var(--a-fg); font: 13px var(--a-font-mono); white-space: nowrap; }
.sel-btn:hover { border-color: var(--a-muted); }
.sel-btn[aria-expanded="true"], .sel-btn:focus-visible { border-color: var(--a-accent); outline: none; }
.sel-label { overflow: hidden; text-overflow: ellipsis; }
.sel-caret { color: var(--a-dim); font-size: 10px; transition: transform .12s; }
.sel-btn[aria-expanded="true"] .sel-caret { transform: rotate(180deg); color: var(--a-accent); }

/* ── popover listbox (select + combobox) ── */
.pop { position: absolute; z-index: 60; min-width: 160px; max-height: 280px; overflow-y: auto; padding: 4px; border: 1px solid var(--a-line-strong); border-radius: 2px; background-color: var(--a-bg); background-image: var(--a-noise); background-size: 180px; font: 13px var(--a-font-mono); }
.pop[hidden] { display: none; }
.pop .opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 30px; padding: 0 8px 0 10px; border-radius: 2px; color: var(--a-fg); cursor: pointer; white-space: nowrap; }
.pop .opt::after { content: ""; width: 12px; height: 12px; flex: 0 0 auto; }
.pop .opt[aria-selected="true"]::after { background: var(--a-accent); clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); transform: scale(.8); }
.pop .opt.active { background: var(--a-raised); }
.pop .opt-label { overflow: hidden; text-overflow: ellipsis; }
.pop .opt mark { background: none; color: var(--a-accent); }
.pop .none { padding: 7px 10px; color: var(--a-dim); }

/* ── dialog ── */
.modal-back { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--a-bg) 72%, transparent); backdrop-filter: blur(2px); animation: kr-fade .12s ease-out; }
.modal { width: min(440px, 100%); border: 1px solid var(--a-line-strong); border-radius: 2px; background-color: var(--a-bg); background-image: var(--a-noise); background-size: 180px; box-shadow: 8px 8px 0 color-mix(in srgb, var(--a-fg) 8%, transparent); animation: kr-rise .14s ease-out; }
.modal > h2 { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--a-line); font: 400 12px var(--a-font-mono); color: var(--a-muted); background-color: var(--a-panel); background-image: repeating-linear-gradient(-45deg, var(--a-line) 0 1px, transparent 1px 7px); }
.modal > h2::before { content: "── "; color: var(--a-dim); }
.modal.danger > h2::before { content: "!! "; color: var(--a-bad); }
.modal .body { padding: 18px 16px 6px; color: var(--a-fg); }
.modal .body p { margin: 0 0 12px; color: var(--a-muted); }
.modal .body label { display: block; margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--a-muted); }
.modal .body input { width: 100%; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; }
@keyframes kr-fade { from { opacity: 0 } }
@keyframes kr-rise { from { opacity: 0; transform: translateY(6px) } }
@media (prefers-reduced-motion: reduce) { .modal-back, .modal { animation: none; } }
select { cursor: pointer; }

/* ── blocks ── */
/* cells draw their own right/bottom borders, so unfilled grid slots show a quiet hatch instead of a solid block */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border-top: 1px solid var(--a-line); border-left: 1px solid var(--a-line); background-color: var(--a-bg); background-image: repeating-linear-gradient(-45deg, var(--a-line) 0 1px, transparent 1px 7px); margin-bottom: 28px; }
.card { background-color: var(--a-bg); background-image: var(--a-noise); background-size: 180px; padding: 18px 20px; counter-increment: cardn; border-right: 1px solid var(--a-line); border-bottom: 1px solid var(--a-line); }
.cards { counter-reset: cardn; }
.card .l::before { content: counter(cardn, decimal-leading-zero) "  "; color: var(--a-dim); }
.card .n { font: 300 32px/1.1 var(--a-font-display); color: var(--a-fg); letter-spacing: -0.02em; }
.card .l { color: var(--a-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
.panel { border: 1px solid var(--a-line); background: var(--a-bg); padding: 0 16px 18px; margin-bottom: 20px; min-width: 0; }
.panel > h2 { margin: 0 -16px 16px; padding: 10px 16px; border-bottom: 1px solid var(--a-line); font: 400 12px var(--a-font-mono); color: var(--a-muted); background-color: var(--a-panel); background-image: repeating-linear-gradient(-45deg, var(--a-line) 0 1px, transparent 1px 7px); }
.panel > h2::before { content: "── "; color: var(--a-dim); }
.panel > table { margin: 0 -16px -18px; width: calc(100% + 32px); }
.panel > h2 + table { margin-top: -16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > input, .row > select { flex: 1 1 160px; }
.row > input[type="checkbox"], label.row > input { flex: 0 0 auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 400; color: var(--a-muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 16px; border-bottom: 1px solid var(--a-line); }
td { padding: 10px 16px; border-bottom: 1px solid var(--a-line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--a-panel); }
.chip { display: inline-block; font: 11.5px var(--a-font-mono); background: var(--a-panel); border: 1px solid var(--a-line); padding: 0 6px; border-radius: 2px; margin: 1px 4px 1px 0; color: var(--a-fg); }
.muted { color: var(--a-muted); }
.ink { color: var(--a-fg); }
.verdict { font: 300 46px/1 var(--a-font-display); letter-spacing: -0.03em; margin: 4px 0 6px; }
.verdict.ok { color: var(--a-ok); } .verdict.bad { color: var(--a-bad); }
.verdict::before { content: "> "; font: 400 14px var(--a-font-mono); color: var(--a-dim); vertical-align: middle; }
pre.code { background-color: var(--a-panel); background-image: var(--a-noise); background-size: 180px; border: 1px solid var(--a-line); border-radius: 0; padding: 14px 16px; overflow-x: auto; margin: 10px 0 0; color: var(--a-fg); line-height: 1.7; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.ops div { font: 12.5px var(--a-font-mono); padding: 3px 0; }
.op-create, .op-link { color: var(--a-ok); } .op-update, .op-set_default { color: var(--a-accent); } .op-delete, .op-unlink { color: var(--a-bad); }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--a-fg); color: var(--a-bg); padding: 10px 14px; border-radius: 2px; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 40px); }
.toast.show { opacity: 1; } .toast.err { background: var(--a-bad); color: #fff; }
.secret { font: 12.5px var(--a-font-mono); background: var(--a-panel); padding: 10px 12px; word-break: break-all; color: var(--a-fg); border: 1px solid var(--a-line); border-left: 2px solid var(--a-accent); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 12px; margin: 10px 0; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--a-fg); }
.empty { padding: 26px; text-align: center; color: var(--a-muted); border: 1px dashed var(--a-line-strong); background-color: var(--a-panel); background-image: repeating-linear-gradient(-45deg, var(--a-line) 0 1px, transparent 1px 7px); }
#theme { all: unset; cursor: pointer; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--a-line-strong); border-radius: 2px; color: var(--a-muted); }
#theme:hover { color: var(--a-fg); border-color: var(--a-muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  nav { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--a-line); padding: 8px; align-items: center; }
  nav .brand { border: 0; height: auto; margin: 0 6px 0 0; padding: 0 8px; }
  nav button { margin: 0 2px; white-space: nowrap; }
  nav .foot { display: none; }
  header.top { padding: 0 16px; position: static; }
  #view { padding: 20px 16px; }
  .split { grid-template-columns: 1fr; }
  table { display: block; overflow-x: auto; }
}
</style>
</head>
<body class="ascii">
<div class="app">
  <nav id="nav">
    <div class="brand"><span class="mark" aria-hidden="true"></span>keyring <small>studio</small></div>
    <div class="foot" id="foot"></div>
  </nav>
  <main>
    <header class="top">
      <h1 id="title">Overview</h1>
      <span class="grow"></span>
      <span class="pill" id="mode">…</span>
      <button id="theme" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
      <select id="space" title="Scope"><option value="">Platform scope</option></select>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const TOKEN = "__KEYRING_TOKEN__";

// Theme: paper / charcoal like the website — system default, remembered per browser.
const SUN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
let theme = null;
try { theme = localStorage.getItem("kr.theme"); } catch {}
theme ||= matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
function applyTheme() {
  document.documentElement.classList.toggle("dark", theme === "dark");
  const b = document.getElementById("theme");
  if (b) b.innerHTML = theme === "dark" ? SUN : MOON;
}
applyTheme();
const VIEWS = ["Overview", "Policy", "Roles", "Actions", "Subjects", "Playground", "Events", "Keys"];
const state = { view: location.hash.slice(1) || "Overview", space: "", info: null, timer: null };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const sp = () => state.space || undefined;
const ago = (t) => { if (!t) return ""; const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? `${Math.max(1, s | 0)}s ago` : s < 3600 ? `${(s / 60) | 0}m ago` : s < 86400 ? `${(s / 3600) | 0}h ago` : new Date(t).toLocaleDateString(); };
const chips = (xs) => (xs || []).map((x) => `<span class="chip">${esc(x)}</span>`).join("") || '<span class="muted">—</span>';

async function call(target, method, ...args) {
  const res = await fetch("/_keyring/rpc", { method: "POST", headers: { "content-type": "application/json", "x-keyring-token": TOKEN }, body: JSON.stringify({ target, method, args }) });
  const body = await res.json();
  if (!body.ok) { const e = new Error(body.error?.message || "error"); e.hint = body.error?.hint; throw e; }
  return body.result;
}
const K = (m, ...a) => call("keyring", m, ...a);
const A = (m, ...a) => call("admin", m, ...a);
const S = (m, ...a) => call("studio", m, ...a);

function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = `toast show${err ? " err" : ""}`; clearTimeout(t._h); t._h = setTimeout(() => (t.className = "toast"), err ? 5000 : 2200); }
async function guard(fn) { try { return await fn(); } catch (e) { toast(e.message + (e.hint ? ` — ${e.hint}` : ""), true); } }

function nav() {
  const n = $("#nav"); n.querySelectorAll("button").forEach((b) => b.remove());
  const foot = $("#foot");
  for (const v of VIEWS) { const b = document.createElement("button"); b.textContent = v; b.className = v === state.view ? "on" : ""; b.onclick = () => go(v); n.insertBefore(b, foot); }
}
function go(v) { state.view = v; location.hash = v; clearInterval(state.timer); nav(); render(); }

async function boot() {
  state.info = await call("studio", "info");
  $("#mode").innerHTML = `<span class="live" aria-hidden="true"></span>${esc(state.info.mode)}`;
  $("#mode").title = state.info.target;
  $("#title").dataset.ws = state.info.workspace.slug;
  $("#mode").className = "pill";
  $("#foot").innerHTML = `${esc(state.info.target)}<br><br><a href="/llms.txt">llms.txt</a> · API <span class="mono">${esc(location.origin)}/api/v1</span>`;
  await loadSpaces();
  $("#space").onchange = (e) => { state.space = e.target.value; render(); };
  nav(); render();
}
async function loadSpaces() {
  const spaces = await K("listSpaces").catch(() => []);
  $("#space").innerHTML = `<option value="">Platform scope</option>` + spaces.map((s) => `<option value="${esc(s.slug)}" ${s.slug === state.space ? "selected" : ""}>${esc(s.name)} (${esc(s.slug)})</option>`).join("");
}

async function render() {
  $("#title").textContent = state.view.toLowerCase();
  const view = $("#view");
  view.dataset.title = state.view;
  view.innerHTML = '<div class="muted">Loading…</div>';
  try { await ({ Overview, Policy, Roles, Actions, Subjects, Playground, Events, Keys }[state.view] || Overview)(view); }

// ── UI components (shadcn-style, ASCII look) ─────────────────────────────
// Native <select>s and <input list=…> are upgraded automatically as views
// render; the native elements stay in the DOM so existing code reading
// `.value` / listening for `change` keeps working.
const ui = (() => {
  const pop = document.createElement("div");
  pop.className = "pop"; pop.hidden = true; pop.setAttribute("role", "listbox");
  document.body.appendChild(pop);
  let owner = null; // { anchor, items: [{value,label}], selected, onPick, onClose }
  let active = -1;

  function place(anchor) {
    const r = anchor.getBoundingClientRect();
    pop.style.minWidth = `${r.width}px`;
    pop.style.left = `${r.left + scrollX}px`;
    const below = innerHeight - r.bottom;
    pop.style.top = below < 220 && r.top > below ? `${r.top + scrollY - Math.min(pop.offsetHeight, 280) - 4}px` : `${r.bottom + scrollY + 4}px`;
  }
  function paint(highlight) {
    pop.innerHTML = owner.items.length
      ? owner.items.map((it, i) => `<div class="opt${i === active ? " active" : ""}" role="option" data-i="${i}" aria-selected="${it.value === owner.selected}"><span class="opt-label">${highlight ? highlight(it.label) : esc(it.label)}</span></div>`).join("")
      : `<div class="none">no matches</div>`;
    pop.querySelector(".opt.active")?.scrollIntoView({ block: "nearest" });
  }
  function open(o) {
    close();
    owner = o;
    active = Math.max(0, o.items.findIndex((it) => it.value === o.selected));
    pop.hidden = false;
    paint(o.highlight);
    place(o.anchor);
  }
  function close() {
    if (!owner) return;
    const o = owner; owner = null; pop.hidden = true; o.onClose?.();
  }
  function move(d) {
    if (!owner || !owner.items.length) return;
    active = (active + d + owner.items.length) % owner.items.length;
    paint(owner.highlight);
  }
  function pick(i) {
    const o = owner; if (!o || !o.items[i]) return;
    close(); o.onPick(o.items[i]);
  }
  pop.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus on the trigger/input
  pop.addEventListener("click", (e) => { const el = e.target.closest(".opt"); if (el) pick(Number(el.dataset.i)); });
  document.addEventListener("mousedown", (e) => { if (owner && !pop.contains(e.target) && !owner.anchor.contains(e.target)) close(); });
  addEventListener("resize", () => owner && place(owner.anchor));
  addEventListener("scroll", () => owner && place(owner.anchor), true);

  // <select> → trigger button + listbox
  function enhanceSelect(sel) {
    sel.dataset.enhanced = "1";
    const wrap = document.createElement("span");
    wrap.className = "sel";
    sel.replaceWith(wrap);
    wrap.appendChild(sel);
    sel.tabIndex = -1;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "sel-btn";
    btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false");
    if (sel.title) btn.title = sel.title;
    btn.innerHTML = `<span class="sel-label"></span><span class="sel-caret">▼</span>`;
    wrap.appendChild(btn);
    const items = () => [...sel.options].map((o) => ({ value: o.value, label: o.textContent }));
    // Only write when the text actually changes: writing is itself a DOM
    // mutation, and the observer below would otherwise re-trigger forever.
    const label = btn.querySelector(".sel-label");
    const sync = () => { const t = sel.selectedOptions[0]?.textContent ?? ""; if (label.textContent !== t) label.textContent = t; };
    sel._sync = sync; sync();
    sel.addEventListener("change", sync);
    const show = () => {
      btn.setAttribute("aria-expanded", "true");
      open({ anchor: btn, items: items(), selected: sel.value,
        onPick: (it) => { if (sel.value !== it.value) { sel.value = it.value; sel.dispatchEvent(new Event("change", { bubbles: true })); } btn.focus(); },
        onClose: () => btn.setAttribute("aria-expanded", "false") });
    };
    btn.addEventListener("click", () => (owner?.anchor === btn ? close() : show()));
    btn.addEventListener("keydown", (e) => {
      const isOpen = owner?.anchor === btn;
      if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) {
        e.preventDefault();
        if (!isOpen) return show();
        if (e.key === "ArrowDown") move(1); else if (e.key === "ArrowUp") move(-1); else pick(active);
      } else if (e.key === "Escape" && isOpen) { e.preventDefault(); close(); }
      else if (isOpen && e.key.length === 1) { // type to jump
        const i = owner.items.findIndex((it) => it.label.toLowerCase().startsWith(e.key.toLowerCase()));
        if (i >= 0) { active = i; paint(); }
      }
    });
  }

  // <input list="…"> → filtered combobox
  function enhanceCombo(input) {
    input.dataset.enhanced = "1";
    const list = document.getElementById(input.getAttribute("list"));
    const values = list ? [...list.options].map((o) => o.value) : [];
    input.removeAttribute("list");
    input.setAttribute("autocomplete", "off");
    input.setAttribute("role", "combobox");
    const show = () => {
      const q = input.value.trim().toLowerCase();
      const items = values.filter((v) => v.toLowerCase().includes(q)).slice(0, 50).map((v) => ({ value: v, label: v }));
      const highlight = q ? (label) => esc(label).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), (m) => `<mark>${m}</mark>`) : null;
      open({ anchor: input, items, selected: input.value, highlight,
        onPick: (it) => { input.value = it.value; input.dispatchEvent(new Event("input", { bubbles: true })); } });
      if (!q) { active = -1; paint(); }
    };
    input.addEventListener("focus", show);
    input.addEventListener("input", show);
    input.addEventListener("keydown", (e) => {
      if (owner?.anchor !== input) return;
      if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
      else if (e.key === "Enter" && active >= 0) { e.preventDefault(); pick(active); }
      else if (e.key === "Escape") { e.preventDefault(); close(); }
    });
    input.addEventListener("blur", () => setTimeout(() => owner?.anchor === input && close(), 100));
  }

  // modal dialog; resolves with the chosen value (null on Esc / backdrop)
  function dialog({ title, body = "", input, actions, danger = false }) {
    return new Promise((resolve) => {
      const prevFocus = document.activeElement;
      const back = document.createElement("div");
      back.className = "modal-back";
      back.innerHTML = `<div class="modal${danger ? " danger" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <h2>${esc(title)}</h2>
        <div class="body">${body ? `<p>${esc(body)}</p>` : ""}${input ? `<label for="dlg-in">${esc(input.label)}</label><input id="dlg-in" placeholder="${esc(input.placeholder || "")}" autocomplete="off">` : ""}</div>
        <div class="actions">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ""} sm" data-i="${i}">${esc(a.label)}</button>`).join("")}</div>
      </div>`;
      const done = (v) => { document.removeEventListener("keydown", onKey, true); back.remove(); prevFocus?.focus?.(); resolve(v); };
      const field = back.querySelector("#dlg-in");
      const valueOf = (a) => (a.value === "input" ? (field.value.trim() || null) : a.value);
      const onKey = (e) => {
        if (e.key === "Escape") { e.preventDefault(); done(null); }
        else if (e.key === "Enter" && field && document.activeElement === field) { e.preventDefault(); const a = actions.find((x) => x.primary); if (a) done(valueOf(a)); }
        else if (e.key === "Tab") { // keep focus inside
          const f = [...back.querySelectorAll("input, button")];
          const i = f.indexOf(document.activeElement);
          if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
          else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
        }
      };
      document.addEventListener("keydown", onKey, true);
      back.addEventListener("mousedown", (e) => { if (e.target === back) done(null); });
      back.querySelectorAll(".actions button").forEach((b) => (b.onclick = () => done(valueOf(actions[Number(b.dataset.i)]))));
      document.body.appendChild(back);
      (field || back.querySelector(`.actions button[data-i="${actions.findIndex((a) => a.primary)}"]`) || back.querySelector(".actions button")).focus();
    });
  }
  const confirm = ({ title, body, ok = "Confirm", danger = false }) =>
    dialog({ title, body, danger, actions: [{ label: "Cancel", kind: "ghost", value: false }, { label: ok, kind: danger ? "danger" : "", value: true, primary: true }] }).then((v) => v === true);
  const prompt = ({ title, body, label, placeholder, ok = "Continue" }) =>
    dialog({ title, body, input: { label, placeholder }, actions: [{ label: "Cancel", kind: "ghost", value: null }, { label: ok, value: "input", primary: true }] });

  // auto-upgrade anything new, keep select labels in sync with option changes
  const scan = () => {
    document.querySelectorAll("select:not([data-enhanced])").forEach(enhanceSelect);
    document.querySelectorAll("input[list]:not([data-enhanced])").forEach(enhanceCombo);
    document.querySelectorAll("select[data-enhanced]").forEach((s) => s._sync?.());
  };
  // Ignore mutations that only touch our own widgets (labels, popover, dialogs).
  const ours = (n) => n.nodeType === 1 ? n.closest?.(".sel-btn, .pop, .modal-back") : n.parentElement?.closest(".sel-btn, .pop, .modal-back");
  let queued = false;
  new MutationObserver((records) => {
    if (queued || records.every((r) => ours(r.target))) return;
    queued = true;
    queueMicrotask(() => { queued = false; scan(); });
  }).observe(document.body, { childList: true, subtree: true });
  scan();
  return { confirm, prompt, dialog, close };
})();

boot().catch((e) => { $("#view").innerHTML = `<div class="panel"><h2>Can't reach Keyring</h2><p>${esc(e.message)}</p></div>`; });
</script>
</body>
</html>
